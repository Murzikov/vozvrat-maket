</button>
</div>
</div>
<div class="flex flex-1 overflow-hidden">
<!-- Sidebar: графит, как меню Основы -->
<aside class="hidden md:flex flex-col w-64 bg-gray-900 text-gray-300 shadow-2xl md:shadow-none shrink-0 fixed md:static top-0 left-0 h-full z-40" id="main-sidebar">
<div class="p-6 flex-1 overflow-y-auto">

</div>
<nav class="space-y-1 text-sm font-medium">

                    О

<p class="text-[11px] text-gray-400">
                        Клиент
                    </p>
</div>
<form data-maket-logout="" method="post">
<button aria-label="Выйти" class="p-1 text-gray-400 hover:text-white" title="Выйти" type="submit">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
</form>
</div>
</div>
</aside>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto bg-gray-100">
<!-- Toast notifications -->
<div class="fixed top-4 right-4 z-50 space-y-2" id="toast-container"></div>
<div class="p-4 md:p-6">
<!-- Back + Header -->
<div class="flex items-center gap-4 mb-6">
<a class="w-9 h-9 flex items-center justify-center bg-white rounded-full border border-gray-200 shadow-sm hover:bg-gray-50 transition-colors" href="client-refunds.html">
<svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</a>
<div>
<h1 class="text-xl font-bold text-gray-900">Новая заявка на возврат</h1>
</div>
</div>
<div class="max-w-3xl">
<form enctype="multipart/form-data" id="create-form" method="post">
<!-- Order info -->
<div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-4">
<p class="text-sm font-semibold text-gray-900 mb-4">Информация о заказе</p>
<div class="space-y-5">
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">ID заказа</label>
<input class="w-full bg-white rounded-xl px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm mono" maxlength="100" name="order_id" placeholder="#ORD-55441" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">Номер УПД *</label>
<input class="w-full bg-white rounded-xl px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm mono" maxlength="100" name="upd_number" placeholder="УПД-..." required="" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">Причина возврата *</label>
<textarea class="w-full bg-white rounded-xl px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm resize-none" name="reason" placeholder="Опишите причину возврата..." required="" rows="3"></textarea>
</div>
</div>
</div>
<!-- Items -->
<div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-4">
<div class="flex items-center justify-between mb-5">
<p class="text-sm font-semibold text-gray-900">Позиция товара</p>
</div>
<div class="space-y-4" id="items-container">
<!-- Single item: one article per request -->
<div class="item-row bg-gray-50 rounded-2xl p-4">
<div class="grid grid-cols-2 md:grid-cols-3 gap-3">
<div class="col-span-2 md:col-span-1">
<label class="block text-xs font-medium text-gray-700 mb-1">Артикул *</label>
<input class="w-full bg-white rounded-xl px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm mono" name="article[]" placeholder="BOSCH-199-22" required="" type="text"/>
</div>
<div>
<label class="block text-xs font-medium text-gray-700 mb-1">Марка</label>
<input class="w-full bg-white rounded-xl px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm" maxlength="255" name="brand[]" placeholder="Bosch" type="text"/>
</div>
<div>
<label class="block text-xs font-medium text-gray-700 mb-1">Кол-во *</label>
<input class="w-full bg-white rounded-xl px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm" max="2147483647" min="1" name="quantity[]" required="" step="1" type="number" value="1"/>
</div>
<div class="col-span-2 md:col-span-3">
<label class="block text-xs font-medium text-gray-700 mb-1">Цена за шт. (₽)</label>
<input class="w-full bg-white rounded-xl px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm" name="price[]" placeholder="0.00" type="text"/>
</div>
</div>
</div>
</div>
</div>
<!-- Files -->
<div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-6">
<p class="text-sm font-semibold text-gray-900 mb-4">Документы и фотографии</p>
<label class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl p-4 text-center cursor-pointer hover:border-gray-300 hover:bg-gray-50 transition-all">
<svg class="w-6 h-6 text-gray-500 mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></svg>
<p class="text-sm text-gray-800 font-medium">Нажмите, чтобы выбрать файлы</p>
<p class="text-xs text-gray-500 mt-1">XLS, XLSX, PDF, JPG, PNG, WEBP (до 20 МБ)</p>
<input accept=".xls,.xlsx,.pdf,.jpg,.jpeg,.png,.webp" class="hidden" multiple="" name="file" type="file"/>
</label>
<!-- Превью выбранных файлов -->
<div class="grid grid-cols-3 sm:grid-cols-4 gap-3 mt-4" id="file-preview"></div>
<div class="mt-2 text-xs font-medium space-y-0.5" id="file-errors"></div>
</div>
<!-- Buttons -->
<div class="flex gap-3">
<button class="flex-1 py-3.5 bg-brand-500 text-gray-900 rounded-xl font-semibold hover:bg-brand-400 transition-colors text-sm" type="submit">
                    Отправить заявку
                </button>
<a class="flex-none px-6 py-3.5 bg-gray-100 text-gray-700 rounded-xl font-semibold hover:bg-gray-200 transition-colors text-sm" href="client-refunds.html">
                    Отмена
                </a>
</div>
</form>
</div>
</div>

</main>
</div>
