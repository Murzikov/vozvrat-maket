<body class="h-full bg-gray-900 flex items-center justify-center p-4">
<div class="w-full max-w-sm">
<div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8">
<!-- Logo -->
<div class="flex items-center gap-2.5 mb-6 sm:justify-center">
<img alt="" class="w-9 h-9" src="static/img/amx24-mark.png?v=53ecca95120a"/>

<h1 class="text-xl font-bold text-gray-900 mb-5 sm:text-center">Вход</h1>
<!-- Error message container -->

<form class="space-y-4" id="login-form">
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="login-email">Почта</label>
<input autocomplete="email" class="w-full px-3.5 py-2.5 rounded-xl bg-white ring-1 ring-gray-300 focus:outline-none focus:ring-2 focus:ring-brand-500" id="login-email" maxlength="255" name="email" placeholder="name@company.ru" required="" type="email"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="login-password">Пароль</label>
<input autocomplete="current-password" class="w-full px-3.5 py-2.5 rounded-xl bg-white ring-1 ring-gray-300 focus:outline-none focus:ring-2 focus:ring-brand-500" id="login-password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="w-full py-2.5 bg-brand-500 text-gray-900 rounded-xl font-semibold hover:bg-brand-400 transition-colors text-sm" id="login-btn" type="submit">
                Войти в систему
            </button>
</form>
</div>
</div>
