<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>

<!-- Main Content -->
<main class="flex-1 overflow-y-auto bg-gray-50">
<!-- Toast notifications -->
<div class="fixed top-4 right-4 z-50 space-y-2" id="toast-container"></div>
<div class="p-4 md:p-6">
<div class="flex items-center gap-4 mb-6">
<a class="w-9 h-9 flex items-center justify-center bg-white rounded-full border border-gray-200 shadow-sm hover:bg-gray-50 transition-colors" href="client-requests.html">

</a>
<div>
<h1 class="text-xl font-bold text-gray-900">Новый запрос</h1>
<p class="text-xs text-gray-500 mt-0.5">Обязательна только тема – остальное по желанию</p>
</div>
</div>
<div class="max-w-3xl">
<form enctype="multipart/form-data" id="create-form" method="post">
<input name="creation_key" type="hidden" value="7099a02d-7e97-47cb-b7a5-6036151f81ab"/>
<!-- Order info -->
<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-4">
<p class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-4">Информация</p>
<div class="space-y-5">
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">Тема *</label>
<select class="w-full bg-white rounded-xl px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-black focus:outline-none text-sm" name="subject" required="">
<option value="">– Выберите тему –</option>
<option value="delivery">Срок поставки</option>
<option value="rejection">Отказ</option>
<option value="site">Вопрос по работе сайта</option>
<option value="defect">Дефект детали</option>
<option value="free">Свободная тема</option>
</select>
</div>
<div class="hidden" id="subject-text-wrap">
<label class="block text-sm font-medium text-gray-700 mb-1">Своя тема *</label>
<input class="w-full bg-white rounded-xl px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-black focus:outline-none text-sm" maxlength="200" name="subject_text" placeholder="О чём запрос, коротко" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">Опишите запрос</label>
<textarea class="w-full bg-white rounded-xl px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-black focus:outline-none text-sm resize-none" name="reason" placeholder="Опишите ваш вопрос или обращение..." rows="3"></textarea>
</div>
</div>
</div>
<!-- Item (optional) -->
<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-4">
<p class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-4">Позиция товара (необязательно)</p>
<div class="item-row bg-gray-50 rounded-2xl p-4">
<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
<div>
<label class="block text-xs font-medium text-gray-700 mb-1">Артикул</label>
<input class="w-full bg-white rounded-xl px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-black focus:outline-none text-sm mono" name="article[]" placeholder="BOSCH-199-22" type="text"/>
</div>
<div>
<label class="block text-xs font-medium text-gray-700 mb-1">Марка</label>
<input class="w-full bg-white rounded-xl px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-black focus:outline-none text-sm" maxlength="255" name="brand[]" placeholder="Bosch" type="text"/>
</div>
</div>
</div>
</div>
<!-- Files -->
<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-6">
<p class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-4">Документы и фотографии</p>
<label class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl p-4 text-center cursor-pointer hover:border-gray-300 hover:bg-gray-50 transition-all">
<svg class="w-6 h-6 text-gray-500 mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></svg>
<p class="text-sm text-gray-800 font-medium">Нажмите, чтобы выбрать файлы</p>
<p class="text-xs text-gray-500 mt-1">XLS, XLSX, PDF, JPG, PNG, WEBP (до 20 МБ)</p>
<input accept=".xls,.xlsx,.pdf,.jpg,.jpeg,.png,.webp" class="hidden" multiple="" name="file" type="file"/>
</label>
<div class="grid grid-cols-3 sm:grid-cols-4 gap-3 mt-4" id="file-preview"></div>
<div class="mt-2 text-xs font-medium space-y-0.5" id="file-errors"></div>
</div>
<div class="flex gap-3">
<button class="flex-1 py-3.5 bg-gray-900 text-white rounded-xl font-semibold hover:bg-black transition-colors text-sm" type="submit">
                    Отправить запрос
                </button>
<a class="flex-none px-6 py-3.5 bg-gray-100 text-gray-700 rounded-xl font-semibold hover:bg-gray-200 transition-colors text-sm" href="client-requests.html">
                    Отмена
                </a>
</div>
